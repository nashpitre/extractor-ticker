    (function () {

      var results = document.getElementById("extractor-results");

      var connectionLabels = new Set();

      var connectionPackages = [];
      var topicsById = new Map();

      function cleanSource(value) {
        return String(value || "Web").split(/\s(?:\||—|–|-)\s|:/, 1)[0].trim() || "Web";
      }
      function cleanTitle(value) {
        var protectedWords = new Set(["ABC","AI","BBC","CBS","CEO","CNN","ESPN","GB","GBA","GTA","iOS","iPad","iPhone","KONKR","MCON","MLB","NBA","NCAA","NFL","NHL","PS5","TV","UFC","US","VII","VI","WWE","Xbox"]);
        var smallWords = new Set(["AND","FOR","IN","OF","ON","OR","THE","TO"]);
        var title = String(value || "Saved find")
          .replace(/^[\s★☆⭐︎*]+/, "")
          .replace(/\s+(?:https?:\/\/|www\.)\S.*$/i, "")
          .replace(/\s+[-–—]\s+[a-z]{1,2}$/i, "")
          .replace(/\s+\b(?:through|with|from|for|to|of|in|on|at|by)\s+(?:t|th)$/i, "")
          .replace(/\s*\|\s*/g, " — ")
          .trim() || "Saved find";
        return title.replace(/\b[A-Z][A-Z']+\b/g, function (word) {
          if (protectedWords.has(word) || /^[IVXLCDM]+$/.test(word)) return word;
          if (smallWords.has(word)) return word.toLowerCase();
          return word.charAt(0) + word.slice(1).toLowerCase();

      function validConnectionSurface(item) {
        // Broad Apple is a safety-net, never permission to absorb an unrelated

        }

      function promoteFullyOwnedSuffixTopics(items, topics) {

        // result already names the same, more specific phrase. This keeps
        // "Fire Emblem" intact instead of letting the shorter "Emblem" win.
        // It is evidence-based rather than editorial: all of the topic's

        var groups = new Map();

          var topic = topicById.get(item.topicId);
          var label = String(item.topic || "").trim();
          if (!topic || !topic.auto || !/^[a-z]+$/i.test(label)) return;
          var key = item.topicId;
          if (!groups.has(key)) groups.set(key, { label: label, items: [] });
          groups.get(key).items.push(item);
        });
        var replacements = new Map();
        groups.forEach(function (group, topicId) {
          if (group.items.length < 3) return;

          var prefixes = group.items.map(function (item) {
            var words = String(item.title || "").toLowerCase().match(/[a-z0-9]+/g) || [];
            var index = words.indexOf(subject);
            return index > 0 && words[index - 1].length > 2 ? words[index - 1] : "";
          });
          if (!prefixes.every(Boolean) || new Set(prefixes).size !== 1) return;
          var phrase = prefixes[0] + " " + subject;
          if (!group.items.every(function (item) {
            return (" " + String(item.title || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ")
              .includes(" " + phrase + " ");
          })) return;
          replacements.set(topicId, {
            id: "topic-" + phrase.replace(/[^a-z0-9]+/g, "-"),
            label: phrase.split(" ").map(function (word) { return word.charAt(0).toUpperCase() + word.slice(1); }).join(" ")
          });
        });
        if (!replacements.size) return { items: items, topics: topics };
        return {
          items: items.map(function (item) {
            var replacement = replacements.get(item.topicId);
            return replacement ? Object.assign({}, item, { topicId: replacement.id, topic: replacement.label }) : item;
          }),
          topics: topics.map(function (topic) {
            var replacement = replacements.get(topic.id);
            return replacement ? Object.assign({}, topic, replacement) : topic;
          })
        };
      }
      function promoteRepeatedNamedPhrases(items, topics) {
        // When three or more saved titles repeat the same meaningful named
        // phrase, that phrase is a stronger reader-facing connection than a
        // generic fallback such as "Gaming Roundup" or "Nintendo". This is
        // deliberately derived from the current saves, never a hand-written
        // editorial mapping.
        var topicById = new Map((topics || []).map(function (topic) { return [topic.id, topic]; }));
        var ignored = new Set(["the", "and", "for", "from", "with", "this", "that", "your", "have", "will", "into", "about", "after", "over", "more", "than"]);
        var mentions = new Map();
        var phrasesFor = function (title) {
          var words = String(title || "").toLowerCase().match(/[a-z]+/g) || [];
          var phrases = [];
          for (var index = 0; index < words.length - 1; index += 1) {
            if (words[index].length < 3 || words[index + 1].length < 3 || ignored.has(words[index])) continue;
            phrases.push(words[index] + " " + words[index + 1]);
          }
          return phrases;
        };
        items.forEach(function (item, index) {
          var topic = topicById.get(item.topicId);
          if (!topic || !topic.auto) return;
          new Set(phrasesFor(item.title)).forEach(function (phrase) {
            if (!mentions.has(phrase)) mentions.set(phrase, new Set());
            mentions.get(phrase).add(index);
          });
        });
        var supported = new Map(Array.from(mentions).filter(function (entry) { return entry[1].size >= 3; }));
        if (!supported.size) return { items: items, topics: topics };
        var generated = new Map();
        var normalizedItems = items.map(function (item) {
          var topic = topicById.get(item.topicId);
          if (!topic || !topic.auto) return item;
          var choice = phrasesFor(item.title)
            .filter(function (phrase) { return supported.has(phrase); })
            .sort(function (left, right) { return supported.get(right).size - supported.get(left).size; })[0];
          if (!choice || String(topic.label || item.topic || "").toLowerCase().includes(choice)) return item;
          var label = choice.split(" ").map(function (word) { return word.charAt(0).toUpperCase() + word.slice(1); }).join(" ");
          var replacement = { id: "topic-" + choice.replace(/\s+/g, "-"), label: label, auto: true };
          generated.set(replacement.id, replacement);
          return Object.assign({}, item, { topicId: replacement.id, topic: replacement.label });
        });
        if (!generated.size) return { items: items, topics: topics };
        return { items: normalizedItems, topics: topics.concat(Array.from(generated.values())) };
      }
      function consolidateAppleSurface(items) {
        var topics = Array.from(new Set(items.map(function (item) { return String(item.topic || ""); })));
        var literalChildren = topics.filter(function (label) {
          return !/^apple\b/i.test(label) && label.trim().split(/\s+/).length >= 2;
        });
        var hasPhrase = function (title, label) {
          return (" " + String(title || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ")
            .includes(" " + String(label || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim() + " ");
        };
        return items.map(function (item) {
          if (!/^apple\b/i.test(item.topic || "")) return item;
          var target = literalChildren.filter(function (label) { return hasPhrase(item.title, label); })
            .sort(function (left, right) { return right.length - left.length; })[0];
          // A named child owns only its Apple-prefixed variants. Do not flatten
          // hardware and event coverage into one huge Apple bucket.
          if (target) return Object.assign({}, item, { topic: target, topicId: item.topicId });
          if (/^apple$/i.test(item.topic || "")) {
            if (/\b(event|launch|announce|announcement|release|releases|product roadmap|expect)\b/i.test(item.title || "")) {
              return Object.assign({}, item, { topic: "Apple Events & Products" });
            }
            if (/\b(iphone|ipad|macbook|mac mini|macos|imac|vision pro|display|hardware)\b/i.test(item.title || "")) {
              return Object.assign({}, item, { topic: "Apple Hardware" });
            }
          }
          return item;
        });
      }
      function displayDate(value) {
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        return new Intl.DateTimeFormat("en-US", {month:"short",day:"numeric",year:"numeric",timeZone:"America/Chicago"}).format(date);
      }
      function domain(value) {
        try { return new URL(value).hostname.replace(/^www\./, ""); } catch (_) { return "web"; }
      }
      function topicSlug(value) {
        return "connection-" + String(value || "thread").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      }
      function inferConnectionPackages(topics, items) {
        function packageLabel(value) {
          return String(value || "").split(/\s+/).map(function (word) {
            if (word === "iphone") return "iPhone";
            if (word === "ipad") return "iPad";
            if (word === "ios") return "iOS";
            if (word === "ai") return "AI";
            if (word === "gta") return "GTA";
            if (word === "nba") return "NBA";
            return word.charAt(0).toUpperCase() + word.slice(1);
          }).join(" ");
        }
        var roots = new Map();
        topics.forEach(function (topic) {
          var words = String(topic.label || "").toLowerCase().match(/[a-z0-9]+/g) || [];
          if (words[0] === "the") words.shift();
          for (var length = 1; length <= Math.min(2, words.length); length += 1) {
            var phrase = words.slice(0, length).join(" ");
            if (!phrase || phrase === "game" || phrase === "gaming") continue;
            // A package must have a real parent connection of its own. This
            // prevents arbitrary shared headline fragments such as "Apple
            // iPhone", "Apple CEO", or "Grand Theft" from posing as homes.
            var hasParent = topics.some(function (candidate) {
              var candidateWords = String(candidate.label || "").toLowerCase().match(/[a-z0-9]+/g) || [];
              if (candidateWords[0] === "the") candidateWords.shift();
              return candidateWords.join(" ") === phrase;
            });
            if (!hasParent) continue;
            if (!roots.has(phrase)) roots.set(phrase, new Set());
            roots.get(phrase).add(topic.id);
          }
        });
        var claimed = new Set();
        return Array.from(roots.entries()).map(function (entry) {
          return { phrase: entry[0], topicIds: Array.from(entry[1]) };
        }).filter(function (entry) { return entry.topicIds.length >= 2; }).sort(function (a, b) {
          return b.phrase.split(" ").length - a.phrase.split(" ").length || a.phrase.localeCompare(b.phrase);
        }).reduce(function (packages, entry) {
          var ids = entry.topicIds.filter(function (id) { return !claimed.has(id); });
          var count = items.filter(function (item) { return ids.indexOf(item.topicId) !== -1; }).length;
          if (ids.length < 2 || count < 6) return packages;
          ids.forEach(function (id) { claimed.add(id); });
          packages.push({
            id: "package-" + topicSlug(entry.phrase),
            label: packageLabel(entry.phrase),
            topicIds: ids,
            count: count
          });
          return packages;
        }, []);
      }
      function signalTime(item) {
        var value = new Date(item.date_saved || item.date_published).getTime();
        return Number.isNaN(value) ? 0 : value;
      }
      function publishedTime(item) {
        var value = new Date(item.date_published || item.date_saved).getTime();
        return Number.isNaN(value) ? 0 : value;
      }
      function dateKey(value) {
        var date = value instanceof Date ? value : new Date(value);
        if (Number.isNaN(date.getTime())) return "";
        var parts = new Intl.DateTimeFormat("en-US", {year:"numeric",month:"2-digit",day:"2-digit",timeZone:"America/Chicago"}).formatToParts(date);
        var values = {};
        parts.forEach(function (part) { values[part.type] = part.value; });
        return values.year + "-" + values.month + "-" + values.day;
      }
      function relativeTime(item) {
        var diff = Math.max(0, Date.now() - signalTime(item));
        var minutes = Math.floor(diff / 60000);
        if (minutes < 1) return "now";
        if (minutes < 60) return minutes + "m ago";
        var hours = Math.floor(minutes / 60);
        if (hours < 24) return hours + "h ago";
        var days = Math.floor(hours / 24);
        if (days < 7) return days + "d ago";
        return displayDate(item.date_saved || item.date_published);
      }
      var echoStopWords = new Set(["a","an","and","are","as","at","be","but","by","for","from","has","have","his","in","into","is","it","its","more","new","now","of","on","or","our","says","than","that","the","their","them","this","to","up","was","were","with"]);
      function echoTitle(value) {
        return String(value || "").toLowerCase()
          .replace(/grand theft auto\s*(?:6|vi)/g, "gta vi")
          .replace(/gta\s*6/g, "gta vi")
          .replace(/[^a-z0-9]+/g, " ").trim();
      }
      function echoTokens(value) {
        return new Set(echoTitle(value).split(/\s+/).filter(function (word) {
          return word.length > 2 && !echoStopWords.has(word);
        }));
      }
      function sameEvent(first, second) {
        if (echoTitle(first.title) === echoTitle(second.title)) return true;
        var a = echoTokens(first.title);
        var b = echoTokens(second.title);
        var shared = 0;
        a.forEach(function (word) { if (b.has(word)) shared += 1; });
        var overlap = shared / Math.max(1, Math.min(a.size, b.size));
        var jaccard = shared / Math.max(1, a.size + b.size - shared);
        return shared >= 3 && (overlap >= .62 || jaccard >= .42);
      }
      function buildEchoes(items) {
        var echoes = [];
        items.forEach(function (item) {
          var match = echoes.find(function (group) {
            return group.some(function (member) { return sameEvent(item, member); });
          });
          if (match) match.push(item);
          else echoes.push([item]);
        });
        return echoes;
      }
      function parentPhrase(label) {
        var words = echoTitle(label).split(/\s+/).filter(Boolean);
        return words.length > 1 ? words.slice(0, -1).join(" ") : "";
      }
      // The "More …" shelf is intentionally narrower than a normal title
      // search. A short shared opening such as "No Man's" can describe
      // unrelated things (for example, "No Man's Land"), so it needs at
      // least one identifying word before it can pull in a loose extract.
      function isDistinctiveParentPhrase(phrase) {
        return String(phrase || "").split(/\s+/).some(function (word) {
          return word.length >= 5 && !echoStopWords.has(word);
        });
      }
      function titleContainsPhrase(item, phrase) {
        return (" " + echoTitle(item.title) + " ").includes(" " + phrase + " ");
      }
      function connectionCounts() {
        return signals.slice().sort(function (a, b) { return signalTime(b) - signalTime(a); }).slice(0, 50).reduce(function (counts, item) {
          var label = item.topic || item.url || item.title;
          counts[label] = (counts[label] || 0) + 1;
          return counts;
        }, {});
      }
      function updateFieldReport() {
        var counts = connectionCounts();
        var today = dateKey(new Date());
        var todaysItems = signals.filter(function (item) { return dateKey(item.date_saved || item.date_published) === today; });
        var activeThreads = Object.keys(counts).filter(function (label) { return counts[label] >= 3; });
        var uncharted = todaysItems.filter(function (item) {
          var label = item.topic || item.url || item.title;
          return (counts[label] || 0) < 3;
        }).length;
        cargo.textContent = signals.length + " extracts · " + todaysItems.length + " today · " + activeThreads.length + " threads · " + uncharted + " uncharted";
      }
      function renderBriefing() {
        var newestSignals = signals.slice().sort(function (a, b) {
          return signalTime(b) - signalTime(a);
        }).slice(0, 18);
        terminalList.replaceChildren();
        newestSignals.forEach(function (item) {
          var row = document.createElement("li");
          var link = document.createElement("a");
          var topic = document.createElement("span");
          var title = document.createElement("strong");
          var meta = document.createElement("span");
          link.className = "extractor-terminal-link";
          link.href = item.url;
          link.rel = "noopener";
          topic.className = "extractor-terminal-topic";
          topic.textContent = item.topic || cleanSource(item.source);
          title.className = "extractor-terminal-title";
          title.textContent = cleanTitle(item.title);
          meta.className = "extractor-terminal-meta";
          meta.textContent = cleanSource(item.source) + " · " + relativeTime(item);
          link.append(topic, title, meta);
          row.append(link);
          terminalList.append(row);
        });
        var groups = new Map();
        signals.forEach(function (item) {
          var label = item.topic || "";
          if (!connectionLabels.has(label)) return;
          if (!groups.has(label)) groups.set(label, []);
          groups.get(label).push(item);
        });
        var ranked = Array.from(groups.entries()).filter(function (entry) {
          return entry[1].length >= 3;
        }).sort(function (a, b) {
          var newestA = Math.max.apply(null, a[1].map(signalTime));
          var newestB = Math.max.apply(null, b[1].map(signalTime));
          return newestB - newestA || b[1].length - a[1].length || a[0].localeCompare(b[0]);
        });
        var picks = ranked.slice(0, 3);
        var moreDevelopments = ranked.slice(3, 9);
        briefingList.replaceChildren();
        picks.forEach(function (entry) {
          var label = entry[0];
          var members = entry[1];
          var item = document.createElement("li");
          var link = document.createElement("a");
          var kicker = document.createElement("span");
          var title = document.createElement("strong");
          var latest = document.createElement("span");
          var sources = document.createElement("span");
          var newest = members.slice().sort(function (a, b) { return signalTime(b) - signalTime(a); })[0];
          var sourceNames = Array.from(new Set(members.map(function (member) { return cleanSource(member.source); }))).slice(0, 3);
          link.className = "extractor-briefing-link";
          link.href = "#" + topicSlug(label);
          kicker.className = "extractor-briefing-kicker";
          kicker.textContent = "Developing story";
          title.className = "extractor-briefing-title";
          title.textContent = label;
          latest.className = "extractor-briefing-latest";
          latest.textContent = cleanTitle(newest.title);
          sources.className = "extractor-briefing-sources";
          sources.textContent = sourceNames.join(" · ");
          link.append(kicker, title, latest, sources);
          item.append(link);
          briefingList.append(item);
        });
        developmentList.replaceChildren();
        moreDevelopments.forEach(function (entry) {
          var label = entry[0];
          var members = entry[1];
          var newest = members.slice().sort(function (a, b) { return signalTime(b) - signalTime(a); })[0];
          var row = document.createElement("li");
          var link = document.createElement("a");
          var title = document.createElement("strong");
          var latest = document.createElement("span");
          link.className = "extractor-development-link";
          link.href = "#" + topicSlug(label);
          title.className = "extractor-development-title";
          title.textContent = label;
          latest.className = "extractor-development-latest";
          latest.textContent = cleanTitle(newest.title);
          link.append(title, latest);
          row.append(link);
          developmentList.append(row);
        });
        var recentFinds = signals.filter(function (item) {
          return !connectionLabels.has(item.topic || "");
        }).sort(function (a, b) {
          return signalTime(b) - signalTime(a);
        }).slice(0, 3);
        discoveryList.replaceChildren();
        recentFinds.forEach(function (item) {
          var row = document.createElement("li");
          var link = document.createElement("a");
          link.className = "extractor-discovery-link";
          link.href = item.url;
          link.rel = "noopener";
          link.textContent = cleanTitle(item.title);
          row.append(link);
          discoveryList.append(row);
        });
        developments.hidden = !moreDevelopments.length;
        discoveries.hidden = !recentFinds.length;
        terminal.hidden = !newestSignals.length;
        briefing.hidden = !newestSignals.length;
      }
      function render(list) {
        results.replaceChildren();
        var sorted = list.slice().sort(function (a,b) { return signalTime(b)-signalTime(a); });
        function widget(title, items, id, progressive) {
          var section=document.createElement("section");
          section.className="extractor-region extractor-region--trending";
          if(id) section.id=id;
          var header=document.createElement("header");
          header.className="extractor-region-head";
          var heading=document.createElement("h2"); heading.textContent=title;
          header.append(heading); section.append(header);
          var rows=document.createElement("ol"); rows.className="extractor-topic-list";
          items.forEach(function(item){
            var row=document.createElement("li"); row.className="extractor-item";
            var copy=document.createElement("div"); copy.className="extractor-copy";
            var link=document.createElement("a"); link.className="extractor-title";
            link.href=item.url; link.rel="noopener"; link.textContent=cleanTitle(item.title);
            var date=document.createElement("time"); date.className="extractor-date";
            date.textContent=displayDate(item.date_saved||item.date_published);
            copy.append(link); row.append(copy,date); rows.append(row);
          });
          section.append(rows);
          if(progressive && items.length>5){
            var offset=0;
            var more=document.createElement("button"); more.type="button"; more.className="extractor-more";
            var previous=document.createElement("button"); previous.type="button"; previous.className="extractor-more";
            previous.textContent="Previous 5";
            function updateRows(){
              Array.from(rows.children).forEach(function(row,index){row.hidden=index<offset||index>=offset+5;});
              more.hidden=offset+5>=items.length;
              more.textContent="Next "+Math.min(5,items.length-offset-5);
              previous.hidden=offset===0;
            }
            more.addEventListener("click",function(){offset=Math.min(offset+5,Math.floor((items.length-1)/5)*5);updateRows();});
            previous.addEventListener("click",function(){offset=Math.max(0,offset-5);updateRows();});
            var navigation=document.createElement("nav"); navigation.className="extractor-pagination";
            navigation.setAttribute("aria-label","Latest links pagination");
            navigation.append(previous,more); section.append(navigation); updateRows();
          }
          results.append(section);
        }
        if(sorted.length) widget("Latest 50 Links",sorted.slice(0,50),null,true);
        var groups=new Map();
        sorted.forEach(function(item){
          if(!connectionLabels.has(item.topic))return;
          if(!groups.has(item.topic))groups.set(item.topic,[]);
          groups.get(item.topic).push(item);
        });
        // Map order follows newest save; archive counts establish real topics.
        var counts={}; signals.forEach(function(item){counts[item.topic]=(counts[item.topic]||0)+1;});
        Array.from(groups.entries()).filter(function(group){return counts[group[0]]>=3;}).slice(0,5)
          .forEach(function(group){widget(group[0],group[1].slice(0,3),topicSlug(group[0]));});
        empty.classList.toggle("is-visible",!sorted.length);
      }
      function filter() {
        var query = search.value.trim().toLowerCase();
        render(signals.filter(function (item) {
          var matchesQuery = !query || [item.title,item.source,domain(item.url)].join(" ").toLowerCase().includes(query);
          return matchesQuery;
        }));
      }
      tools.addEventListener("submit", function (event) {
        event.preventDefault();
        filter();
      });
      search.addEventListener("input", function () {
        if (!search.value.trim()) filter();
      });
      function applyPayload(payload) {
          var validItems = (Array.isArray(payload.items) ? payload.items : []).map(function (item) {
            return validConnectionSurface(item) ? item : Object.assign({}, item, { topic: "Individual Find", topicId: "" });
          });
          var normalizedTopics = promoteFullyOwnedSuffixTopics(validItems, Array.isArray(payload.topics) ? payload.topics : []);
          normalizedTopics = promoteRepeatedNamedPhrases(normalizedTopics.items, normalizedTopics.topics);
          signals = consolidateAppleSurface(normalizedTopics.items);
          var topics = normalizedTopics.topics;
          connectionLabels = new Set(topics.filter(function (topic) { return topic.auto; }).map(function (topic) { return topic.label; }));
          connectionBriefs = payload.briefs && typeof payload.briefs === "object" ? payload.briefs : {};
          topicsById = new Map(topics.map(function (topic) { return [topic.id, topic.label]; }));
          // Connections are intentionally a single, latest-first list. The
          // package experiment hid too much context and created misleading
          // partial containers, so the raw earned threads remain the surface.
          connectionPackages = [];
          filter();
          updateFieldReport();
          page.classList.remove("is-loading");
      }
      fetch(endpoint + "?fresh=" + Date.now(), {cache:"no-store",headers:{Accept:"application/json"},mode:"cors"})
        .then(function (response) { if (!response.ok) throw new Error("Feed unavailable"); return response.json(); })
        .then(function (payload) {
          applyPayload(payload);
          window.setTimeout(function () {
            fetch(endpoint + "?sync=1&fresh=" + Date.now(), {cache:"no-store",headers:{Accept:"application/json"},mode:"cors"})
              .then(function (response) { if (!response.ok) throw new Error("Refresh unavailable"); return response.json(); })
              .then(applyPayload)
              .catch(function () {});
          }, 1200);
        })
        .catch(function () {
          empty.textContent = "The archive could not reach the live feed. Try again shortly.";
          empty.classList.add("is-visible");
          page.classList.remove("is-loading");
        });
    })();
  </script>
